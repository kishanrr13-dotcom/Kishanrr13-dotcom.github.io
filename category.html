<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category | eLoot</title>
<meta name="description" content="Browse the newest products in this category on eLoot.">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div id="site-header" data-root="./" data-region="india" data-pageid="category"></div>

<div class="hero">
  <div class="eyebrow"><span id="category-icon">📦</span> Live Pricing</div>
  <h1 id="category-title">Category</h1>
  <p>Updated automatically from our product sheet.</p>
</div>

<section>
  <div class="filterbar">
    <label>Filter by brand</label>
    <select id="filter-brand-select"><option value="">All brands</option></select>
    <label>Sort by</label>
    <select id="sort-select">
      <option value="">Default</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
    </select>
  </div>

  <div class="card-grid" id="category-feed"></div>
</section>

<section>
  <div id="suggestions-strip"></div>
</section>

<div id="site-footer"></div>
<script src="assets/site.js"></script>
</body>
</html>
